<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">hooksmith --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">hooksmith — lifecycle-hook generator, linter, and verifier for Claude Code</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">Usage:</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">  hooksmith generate [project-root] [--project-type=nextjs|node|python|generic] [--recipes=r1,r2]</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">  hooksmith lint     [settings.json path]</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">  hooksmith test     &quot;&lt;hook command&gt;&quot; [--event=PreToolUse] [--tool=Bash] [--input='{...}'] [--expect=block] [--sandb</text>
<text x="24" y="206" fill="#d8d3c8" xml:space="preserve">  hooksmith test     --settings=.claude/settings.json [--sandbox=e2b]</text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">  hooksmith recall   &quot;&lt;query&gt;&quot;</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">  hooksmith verify</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  hooksmith --version</text>
<text x="24" y="286" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  generate   Emit a &quot;hooks&quot; block for .claude/settings.json</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">  lint       Validate an existing hooks block (exits 1 on errors)</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  test       Fire a hook with a synthetic event and decode its decision (locally, or in an E2B microVM)</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">  recall     Search hooksmith's own memory: identity, lessons, skills and recipes</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  verify     Run a live probe to confirm hooks actually fire (starts a Claude session; requires claude CLI)</text>
<text x="24" y="426" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">Examples:</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">  hooksmith generate .                          # auto-detect project type</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  hooksmith generate . --project-type=nextjs</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">  hooksmith lint .claude/settings.json</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">  hooksmith lint .claude/settings.local.json</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">  hooksmith test &quot;node .claude/hooks/guard.js&quot; --input='{&quot;command&quot;:&quot;rm -rf /&quot;}' --expect=block</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">  hooksmith test --settings=.claude/settings.json --sandbox=e2b</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">  hooksmith verify</text>
</svg>
